<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Pocket Pokédex</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>

<body>
	<main class="container">
		<nav class="nav-links">
			<a href="/gen1" class="nav-link">View Generation 1 Pokémon</a>
		</nav>
		<h1>Pokémon Lookup</h1>
		<form id="search-form">
			<input id="name-input" type="text" placeholder="Enter Pokémon name (e.g., Pikachu)" />
			<button type="submit">Search</button>
		</form>
		<section id="result" class="hidden pokemon-list"></section>
		<p id="error" class="error hidden"></p>
	</main>
	<script src="{{ url_for('static', filename='main.js') }}"></script>
</body>

</html>
